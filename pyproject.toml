[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-monitor"
version = "0.1.0"
description = "Real-time Pegasus WMS workflow monitoring"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "build>=1.4.0",
    "pip>=26.0.1",
]

[project.optional-dependencies]
htcondor = ["htcondor"]

[project.scripts]
workflow-monitor = "workflow_monitor.cli:main"

# Registers the live pegasus-monitord plugin. When this package is installed in
# the same environment as Pegasus, monitord discovers it and (when enabled via
# pegasus.monitord.plugins.wfmonitor.enabled=true) feeds workflow-monitor live.
[project.entry-points."pegasus.monitord.plugins"]
wfmonitor = "workflow_monitor.monitord_plugin:WorkflowMonitorPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_monitor"]

